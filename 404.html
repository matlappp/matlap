<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — Matlap Design</title>
    <meta name="description" content="Désolé, la page que vous cherchez n'existe pas. Retournez à l'accueil pour découvrir Matlap Design.">
    <meta name="author" content="Mathieu Lapalme">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0A0A0A">
    <meta name="apple-mobile-web-app-title" content="Matlap Design">
    <link rel="icon" href="/assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preload" href="/fonts/Instrument-Serif.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Libre-Franklin-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>

    <nav>
        <a href="/" class="nav-name" style="text-decoration:none;">Matlap Design</a>
        <div class="nav-links">
            <a href="/" data-i18n="404.nav.home">Accueil</a>
            <button class="lang-switch" id="langSwitch" aria-label="Switch language">EN</button>
        </div>
    </nav>

    <section class="error-page">
        <div class="error-code">404</div>
        <div class="error-content">
            <p class="error-label" data-i18n="404.label">Erreur 404</p>
            <h1 data-i18n="404.title" data-i18n-html="true">Cette page <em>n'existe pas</em></h1>
            <p class="error-desc" data-i18n="404.desc">La page que vous cherchez a peut-être été déplacée, supprimée, ou n'a jamais existé.</p>
            <a href="/" class="error-btn">
                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                <span data-i18n="404.btn">Retour à l'accueil</span>
            </a>
        </div>
    </section>

    <footer>
        <span class="footer-left">© <span id="year"></span> Matlap Design</span>
        <div class="footer-right">
            <a href="https://www.instagram.com/mathieu.lapp/" target="_blank" rel="noopener">Instagram</a>
        </div>
    </footer>

    <script src="/scripts/main.js" defer></script>
</body>
</html>
